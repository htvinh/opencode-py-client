<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>opencode web-chat sample</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 720px; padding: 16px; }
    header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    input[type="text"], input:not([type]) { padding: 8px; font-size: 14px; }
    #base-url { flex: 1; min-width: 220px; }
    #session-id { font-family: monospace; font-size: 12px; opacity: 0.8; }
    #messages { border: 1px solid #8884; border-radius: 8px; height: 50vh; overflow-y: auto; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; animation: msg-in 0.18s ease-out; }
    .msg.you { align-self: flex-end; background: #4a90d920; }
    .msg.assistant { align-self: flex-start; background: #8882; }
    @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .thinking { display: flex; align-items: center; gap: 8px; }
    .thinking .dots { display: inline-flex; gap: 4px; }
    .thinking .dots span { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.35; animation: dot-bounce 1.1s infinite; }
    .thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot-bounce { 0%, 60%, 100% { transform: none; opacity: 0.35; } 30% { transform: translateY(-5px); opacity: 1; } }
    .thinking .label { font-size: 13px; opacity: 0.75; }
    .activity { align-self: stretch; font-size: 13px; background: #8881; border: 1px solid #8883; border-radius: 8px; padding: 6px 10px; }
    .activity summary { cursor: pointer; opacity: 0.8; }
    .activity ul { margin: 6px 0 4px; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
    .activity li { animation: msg-in 0.18s ease-out; opacity: 0.9; }
    .question-card { align-self: stretch; border: 1px solid #4a90d966; border-radius: 8px; padding: 10px 12px; background: #4a90d912; animation: msg-in 0.18s ease-out; }
    .question-card fieldset { border: 1px solid #8883; border-radius: 6px; margin: 0 0 8px; }
    .question-card legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
    .question-card .qtext { margin: 4px 0 8px; font-size: 14px; }
    .question-card label { display: block; font-size: 13px; padding: 3px 0; cursor: pointer; }
    .question-card input { margin-right: 6px; }
    .question-card .btn-row { display: flex; gap: 8px; }
    .question-card.answered { opacity: 0.6; }
    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; }
      .thinking .dots span { animation: none; opacity: 0.7; }
    }
    .who { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
    #composer { display: flex; gap: 8px; }
    #input { flex: 1; }
    #send:disabled { opacity: 0.55; cursor: wait; }
    #status { margin-top: 8px; font-size: 13px; opacity: 0.8; }
    #status.error { color: #c0392b; }
    label.stream { display: flex; gap: 4px; align-items: center; font-size: 14px; }
  </style>
</head>
<body>
  <h1>opencode web-chat <small>(TS sample)</small></h1>
  <header>
    <input id="base-url" value="http://127.0.0.1:4096" aria-label="OpenCode server base URL" />
    <button id="new-session" type="button">New session</button>
    <span id="session-id" title="session id">no session yet</span>
  </header>
  <div id="messages" aria-live="polite"></div>
  <form id="composer">
    <input id="input" placeholder="Ask something…" autocomplete="off" />
    <label class="stream"><input id="stream-toggle" type="checkbox" checked /> stream</label>
    <button id="send" type="submit">Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
  <div id="status"></div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
